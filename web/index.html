<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>tscircuitboy</title><link rel="stylesheet" href="style.css"></head>
<body><main>
<div class="screen-wrap">
<canvas id="screen" width="480" height="320" tabindex="0" aria-label="Game display"></canvas>
<div id="empty" class="game-menu" aria-label="Game selection">
<button id="shareware" class="game-card" aria-label="Play Doom"><span class="doom-art" aria-hidden="true">D</span><span>DOOM</span></button>
<button id="star" class="game-card" aria-label="Play Star Test"><span class="star-art" aria-hidden="true">✦</span><span>STAR TEST</span></button>
</div>
<div id="paused" hidden aria-label="Paused">Ⅱ</div>
</div>
<div class="toolbar">
<button id="games" aria-label="Game selection" title="Games">▦</button>
<button id="pause" disabled aria-label="Pause" title="Pause">Ⅱ</button>
<button id="fullscreen" aria-label="Full screen" title="Full screen">⛶</button>
</div>
<p id="status" role="status" hidden></p>
<form id="save-name-form" hidden><label>Save name <input id="save-name" maxlength="20" value="PLAY TEST" autocomplete="off"></label><button id="save-confirm" type="submit">Save</button></form>
<details id="controls"><summary>Controls</summary>
<div class="touch-controls" aria-label="Touch controls"><div class="dpad"><button data-button="0" aria-label="Up">↑</button><button data-button="2" aria-label="Left">←</button><button data-button="1" aria-label="Down">↓</button><button data-button="3" aria-label="Right">→</button></div><div class="system-buttons"><button data-button="8">Select</button><button data-button="9">Start</button><button data-button="10">L</button><button data-button="11">R</button></div><div class="face-buttons"><button data-button="6">X</button><button data-button="7">Y</button><button data-button="5">B</button><button data-button="4" class="accent">A</button></div></div>
<div class="keys"><span>Move <kbd>↑ ↓ ← →</kbd></span><span>A <kbd>Z / Enter</kbd></span><span>B <kbd>X</kbd></span><span>Run <kbd>Shift</kbd></span><span>Weapon <kbd>C</kbd></span><span>Strafe <kbd>Q / E</kbd></span><span>Menu <kbd>Esc</kbd></span><span>Map <kbd>Tab</kbd></span></div>
</details>
<details id="advanced"><summary>Advanced controls</summary>
<div class="advanced-grid">
<label>Display <select id="display-mode"><option value="full">Full frame</option><option value="fields">3-field preview</option></select></label>
<button id="restart" disabled>Restart</button>
<label for="wad" class="file-button" tabindex="0" role="button">Open WAD</label><input id="wad" type="file" accept=".wad" hidden>
<button id="export" disabled>Export saves</button>
<label class="file-button" for="saves" tabindex="0" role="button">Import saves</label><input id="saves" type="file" accept=".json" hidden>
</div>
<p id="save-status" role="status" hidden></p>
<div class="metrics"><span id="game-title">—</span><span id="fps">—</span></div>
<details><summary>Log</summary><pre id="log"></pre></details>
</details>
</main><script type="module" src="app.js"></script></body></html>
